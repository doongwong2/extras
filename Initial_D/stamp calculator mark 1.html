<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Stamp Calculator</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 800px; width: 100%; display: flex; gap: 20px; }
        .calc-section { flex: 1; }
        .reward-section { flex: 1; border-left: 1px solid #ddd; padding-left: 20px; max-height: 500px; overflow-y: auto; }
        h2 { color: #333; margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9em; margin-bottom: 5px; color: #666; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        button:hover { background: #45a049; }
        #result { margin-top: 20px; padding: 15px; border-radius: 4px; line-height: 1.6; display: none; }
        .success { background: #e8f5e9; border: 1px solid #c8e6c9; }
        .fail { background: #ffebee; border: 1px solid #ffcdd2; }
        .milestone-item { font-size: 0.85em; padding: 3px 0; border-bottom: 1px solid #eee; }
        .reset-notice { font-size: 0.8em; color: #e67e22; font-style: italic; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="calc-section">
        <h2>Stamp Calculator</h2>
        <p class="reset-notice">Note: Weekly reset is Monday at 07:00 AM.</p>
        
        <div class="input-group">
            <label>Current Stamps</label>
            <input type="number" id="currentStamps" value="0">
        </div>

        <div class="input-group">
            <label>Target Reward</label>
            <select id="targetReward"></select>
        </div>

        <div class="input-group">
            <label>Start Date (Today)</label>
            <input type="date" id="startDate">
        </div>

        <div class="input-group">
            <label>End Date (Deadline)</label>
            <input type="date" id="endDate">
        </div>

        <button onclick="calculate()">Calculate Strategy</button>

        <div id="result"></div>
    </div>

    <div class="reward-section">
        <h3>Milestones</h3>
        <div id="milestoneList"></div>
    </div>
</div>

<script>
    const milestones = [
        {s: 5, n: "Chat sticker 1"}, {s: 10, n: "Title plate 1"}, {s: 15, n: "Dress up coin x1"},
        {s: 20, n: "Title plate 2 + car vinyl"}, {s: 25, n: "Chat sticker 2"}, {s: 30, n: "Avatar hairstyle"},
        {s: 35, n: "Avatar coin x1"}, {s: 40, n: "Title plate 3"}, {s: 45, n: "Chat sticker 3"},
        {s: 50, n: "Avatar clothes"}, {s: 55, n: "Dress up coin x1"}, {s: 60, n: "Title plate 4"},
        {s: 65, n: "Avatar coin x1"}, {s: 70, n: "Chat sticker 4"}, {s: 75, n: "Dress up coin x1"},
        {s: 80, n: "Spedometer"}, {s: 85, n: "Avatar coin x1"}, {s: 90, n: "Dress up coin x1"},
        {s: 95, n: "Avatar coin x1"}, {100: "Title plate 5", s: 100, n: "Title plate 5"},
        {s: 110, n: "Dress up coin x1"}, {s: 120, n: "Aura"}, {s: 130, n: "Avatar coin x1"},
        {s: 140, n: "Title plate 6 + vinyl DX"}, {s: 150, n: "Dress up coin x1"},
        {s: 160, n: "Cup acrylic"}, {s: 170, n: "Avatar coin x1"}, {s: 180, n: "Title plate 7"}
    ];

    // Populate UI
    const select = document.getElementById('targetReward');
    const list = document.getElementById('milestoneList');
    milestones.forEach(m => {
        let opt = document.createElement('option');
        opt.value = m.s; opt.innerHTML = `${m.s} Stamps: ${m.n}`;
        select.appendChild(opt);
        
        let item = document.createElement('div');
        item.className = 'milestone-item';
        item.innerHTML = `<strong>${m.s}</strong>: ${m.n}`;
        list.appendChild(item);
    });

    // Default dates
    document.getElementById('startDate').valueAsDate = new Date();

    function calculate() {
        const current = parseInt(document.getElementById('currentStamps').value) || 0;
        const target = parseInt(document.getElementById('targetReward').value);
        const start = new Date(document.getElementById('startDate').value);
        const end = new Date(document.getElementById('endDate').value);
        
        if (end <= start) {
            alert("End date must be after start date!");
            return;
        }

        const diffTime = Math.abs(end - start);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1; 
        
        let totalDailyBonus = diffDays * 2;
        let totalBaseStamps = diffDays * 1; // 1 stamp for the first game played daily
        
        // Weekly logic: Count Mondays between dates
        let totalWeeklyBonus = 0;
        let tempDate = new Date(start);
        while (tempDate <= end) {
            if (tempDate.getDay() === 1) { // 1 = Monday
                totalWeeklyBonus += 4;
            }
            tempDate.setDate(tempDate.getDate() + 1);
        }

        const guaranteedStamps = current + totalDailyBonus + totalWeeklyBonus + totalBaseStamps;
        const remainingNeeded = target - guaranteedStamps;
        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';

        if (remainingNeeded <= 0) {
            resultDiv.className = 'success';
            resultDiv.innerHTML = `<strong>Goal Reachable!</strong><br>You will have enough stamps by playing just 1 round per day.`;
        } else {
            resultDiv.className = 'fail';
            resultDiv.innerHTML = `
                <strong>Plan:</strong><br>
                1. Play at least 1 round for <b>${diffDays} days</b> straight.<br>
                2. This gets you to ${guaranteedStamps} stamps.<br>
                3. You need <b>${remainingNeeded}</b> more extra rounds total.<br>
                <hr>
                <em>Target: ${target} | Days Left: ${diffDays}</em>
            `;
        }
    }
</script>

</body>
</html>
